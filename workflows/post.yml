name: Threads投稿

on:
  schedule:
    # 毎日 20:00 JST（11:00 UTC）月〜土。日曜は投稿しない
    # ※GitHub Actions の schedule は混雑時に数分〜十数分遅れることがあります
    - cron: "0 11 * * 1-6"
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD)。空欄なら今日"
        required: false
      dry_run:
        description: "実際には投稿しない"
        type: boolean
        default: false
      skip_approval:
        description: "承認チェックを省略して投稿する"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 対象日を決める
        id: d
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          DATE="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "weekday=$(TZ=Asia/Tokyo date -d "$DATE" +%u)" >> "$GITHUB_OUTPUT"

      - name: 投稿
        id: post
        if: steps.d.outputs.weekday != '7'
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TZ: Asia/Tokyo
        run: |
          python -m src.cli post \
            --date "${{ steps.d.outputs.date }}" \
            ${{ github.event.inputs.skip_approval == 'true' && ' ' || '--require-approval' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: ログと履歴をコミット
        if: steps.d.outputs.weekday != '7'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add data drafts
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "投稿ログ: ${{ steps.d.outputs.date }}"
            git push
          fi

      - name: 結果を Issue に反映
        if: steps.d.outputs.weekday != '7'
        uses: actions/github-script@v7
        env:
          TARGET_DATE: ${{ steps.d.outputs.date }}
          POST_RESULT: ${{ steps.post.outcome }}
        with:
          script: |
            const fs = require('fs');
            const date = process.env.TARGET_DATE;
            const path = `drafts/${date}.json`;
            if (!fs.existsSync(path)) return;
            const d = JSON.parse(fs.readFileSync(path, 'utf8'));
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'threads-draft',
            });
            const issue = issues.find(i => i.title.includes(date));
            let msg;
            if (d.status === 'posted') {
              msg = `✅ 投稿完了しました（post_id: ${d.threads_post_id} / reply_id: ${d.threads_reply_id}）`;
            } else if (d.status === 'failed') {
              msg = `❌ 投稿に失敗しました: ${d.error}`;
            } else {
              msg = `⏭ 未承認のため投稿を見送りました（status: ${d.status}）`;
            }
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: msg,
              });
              if (d.status === 'posted') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed',
                });
              }
            }
            if (d.status === 'failed') core.setFailed(msg);
