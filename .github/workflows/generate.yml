name: 下書き生成（週次）

on:
  schedule:
    # 毎週月曜 8:00 JST（前週日曜 23:00 UTC）に、その週の月〜土6日分をまとめて生成
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      monday:
        description: "対象週の月曜日 (YYYY-MM-DD)。空欄なら今日を含む週の月曜"
        required: false
      force:
        description: "既存の下書きを上書きする"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: threads-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 対象週の月曜日を決める
        id: w
        env:
          INPUT_MONDAY: ${{ github.event.inputs.monday }}
          TZ: Asia/Tokyo
        run: |
          MONDAY=$(python3 -c "
          import os
          from datetime import date, timedelta
          base = os.environ.get('INPUT_MONDAY') or date.today().isoformat()
          y, m, d = map(int, base.split('-'))
          dt = date(y, m, d)
          print(dt - timedelta(days=dt.weekday()))
          ")
          echo "monday=$MONDAY" >> "$GITHUB_OUTPUT"

      - name: 下書きを生成（月〜土6日分）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          TZ: Asia/Tokyo
        run: |
          python -m src.cli generate-week \
            --monday "${{ steps.w.outputs.monday }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 下書きをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "下書き生成: ${{ steps.w.outputs.monday }}週"
            git push
          fi

      - name: 確認用 Issue を作成
        uses: actions/github-script@v7
        env:
          MONDAY: ${{ steps.w.outputs.monday }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const monday = process.env.MONDAY;
            const mondayDate = new Date(`${monday}T00:00:00+09:00`);
            const weekdayJa = ['日', '月', '火', '水', '木', '金', '土'];

            const sections = [];
            let anyDraft = false;
            let anyWarning = false;

            for (let i = 0; i < 6; i++) {
              const d = new Date(mondayDate.getTime() + i * 86400000);
              const dateStr = d.toISOString().slice(0, 10);
              const path = `drafts/${dateStr}.json`;
              if (!fs.existsSync(path)) continue;
              const draft = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (draft.status === 'posted') continue;
              anyDraft = true;

              const md = String(d.getMonth() + 1);
              const dd = String(d.getDate());
              const wd = weekdayJa[d.getDay()];
              const warn = (draft.warnings || []).map(w => `- ⚠️ ${w}`).join('\n');
              if (warn) anyWarning = true;

              sections.push([
                `## ${md}/${dd}（${wd}） ${draft.theme_name} ／ ${draft.angle_label}`,
                '',
                '### 本文（1投稿目）',
                '```',
                draft.body,
                '```',
                '### 返信（2投稿目）',
                '```',
                draft.reply,
                '```',
                warn ? `### 要確認\n${warn}` : '',
              ].join('\n'));
            }

            if (!anyDraft) {
              core.info('生成対象の下書きがないため Issue 作成をスキップ');
              return;
            }

            const lastDate = new Date(mondayDate.getTime() + 5 * 86400000).toISOString().slice(0, 10);
            const body = [
              `**対象週**: ${monday} 〜 ${lastDate}（月〜土）`,
              anyWarning ? '⚠️ 一部の日に自動チェックの要確認事項があります。該当日の内容を確認してください。' : '',
              '',
              '---',
              '',
              sections.join('\n\n---\n\n'),
              '',
              '---',
              '## 使い方',
              '- 各コードブロックはGitHubのコピーボタンでそのままコピーできます（本文→返信の順に貼り付け）',
              '- 修正したい場合は `drafts/YYYY-MM-DD.json` を直接編集してからコピペしてください（生成直後との差分は `/posted` 時に style-notes.md へ自動で記録されます）',
              '- 投稿したら、その日付でこのIssueに `/posted YYYY-MM-DD` とコメントしてください（日付省略時は当日扱い）',
              'やめる場合はその日付で `/reject YYYY-MM-DD` とコメントしてください',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[下書き] ${monday}週（${monday} 〜 ${lastDate}）`,
              body,
              labels: ['threads-draft'],
            });
            core.info(`Issue #${issue.number} を作成しました`);
