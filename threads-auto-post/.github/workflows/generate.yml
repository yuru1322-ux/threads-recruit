name: 下書き生成

on:
  schedule:
    # 毎日 10:00 JST（01:00 UTC）月〜土。日曜は生成しない
    - cron: "0 1 * * 1-6"
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD)。空欄なら今日"
        required: false
      angle:
        description: "切り口ID（省略可）"
        required: false
      force:
        description: "既存の下書きを上書きする"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: threads-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 対象日を決める
        id: d
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          DATE="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "weekday=$(TZ=Asia/Tokyo date -d "$DATE" +%u)" >> "$GITHUB_OUTPUT"

      - name: 下書きを生成
        if: steps.d.outputs.weekday != '7'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          TZ: Asia/Tokyo
        run: |
          python -m src.cli generate \
            --date "${{ steps.d.outputs.date }}" \
            ${{ github.event.inputs.angle && format('--angle {0}', github.event.inputs.angle) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 下書きをコミット
        if: steps.d.outputs.weekday != '7'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "下書き生成: ${{ steps.d.outputs.date }}"
            git push
          fi

      - name: 確認用 Issue を作成
        if: steps.d.outputs.weekday != '7'
        uses: actions/github-script@v7
        env:
          TARGET_DATE: ${{ steps.d.outputs.date }}
        with:
          script: |
            const fs = require('fs');
            const date = process.env.TARGET_DATE;
            const path = `drafts/${date}.json`;
            if (!fs.existsSync(path)) { core.info('下書きファイルなし。Issue作成をスキップ'); return; }
            const d = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (d.status === 'posted') { core.info('投稿済みのためスキップ'); return; }
            const warn = (d.warnings || []).map(w => `- ⚠️ ${w}`).join('\n');
            const body = [
              `**テーマ**: ${d.theme_name} ／ **切り口**: ${d.angle_label}`,
              `**投稿予定**: ${date} 20:00 (JST)`,
              '',
              '### 1投稿目（本文）',
              '```',
              d.body,
              '```',
              '### 2投稿目（返信欄）',
              '```',
              d.reply,
              '```',
              warn ? `### 要確認\n${warn}` : '',
              '---',
              '**承認する場合**: このIssueに `/approve` とコメントしてください（20:00に自動投稿されます）',
              '**やめる場合**: `/reject` とコメントしてください',
              '**修正したい場合**: `drafts/' + date + '.json` を直接編集してから `/approve` してください',
            ].join('\n');
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[下書き] ${date} ${d.theme_name}`,
              body,
              labels: ['threads-draft'],
            });
            core.info(`Issue #${issue.number} を作成しました`);
